<!DOCTYPE html>
<html>
<head>
    <title>Sign Up and Login</title>
</head>
<body style="background-color: blue; color: white;>

    <center>
        <div style="background-color: white; color: black; width: 350px; padding: 20px; border-radius: 10px;">
            <h1>Sign Up</h1>
            <p>It's free and only takes a minute</p>

            <form>
                <label for="fname">First Name</label><br>
                <input type="text" id="fname" name="fname" style="width: 90%;"><br><br>

                <label for="lname">Last Name</label><br>
                <input type="text" id="lname" name="lname" style="width: 90%;"><br><br>

                <label for="email">Email</label><br>
                <input type="email" id="email" name="email" style="width: 90%;"><br><br>

                <label for="pass">Password</label><br>
                <input type="password" id="pass" name="pass" style="width: 90%;"><br><br>

                <label for="cpass">Confirm Password</label><br>
                <input type="password" id="cpass" name="cpass" style="width: 90%;"><br><br>

                <input type="submit" value="Submit" style="background-color: #48c9b0; color: white; border: none; padding: 10px; width: 95%; font-weight: bold; cursor: pointer;"><br><br>
                
                <small>By clicking the Sign Up button, you agree to our <br>
                <a href="#">Terms and Condition</a> and <a href="#">Policy Privacy</a></small>
            </form>
        </div>
        <p>Already have an account? <a href="#" style="color: #48c9b0;">Login here</a></p>
    </center>

    <br><hr style="width: 50%;"><br>

    <center>
        <div style="background-color: white; color: black; width: 350px; padding: 20px; border-radius: 10px;">
            <h1>Login</h1>

            <form>
                <label for="login_email">Email</label><br>
                <input type="email" id="login_email" name="login_email" style="width: 90%;"><br><br>

                <label for="login_pass">Password</label><br>
                <input type="password" id="login_pass" name="login_pass" style="width: 90%;"><br><br>

                <input type="submit" value="Submit" style="background-color: #48c9b0; color: white; border: none; padding: 10px; width: 95%; font-weight: bold; cursor: pointer;">
            </form>
        </div>
        <p>Not have an account? <a href="#" style="color: #48c9b0;">Sign Up Here</a></p>
    </center>

</body>
</html>
